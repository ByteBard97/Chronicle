[project]
name = "chronicle"
version = "0.1.0"
description = "External social simulation service for Skyrim SE/AE: beliefs, rumors, grudges, and reputation across the whole game world."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
testpaths = ["chronicle/tests", "scenarios"]

[tool.ruff]
extend-exclude = ["tools/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronicle"]
